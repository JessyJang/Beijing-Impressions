<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>云房间 · 粒子效果试片</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script></head>
